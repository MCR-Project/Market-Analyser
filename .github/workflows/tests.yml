name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r fetcher/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest

      # The frontend's own unit tests (Vitest, issue #148). Kept in this
      # job rather than a second one: `npm ci` is the only extra cost, and
      # one red/green answer for "do the tests pass" is worth more than the
      # parallelism.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix app

      - name: Run frontend tests
        run: npm --prefix app test
