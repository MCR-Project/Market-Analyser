name: Complete database (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without writing to Supabase"
        type: boolean
        default: false

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Complete ETFs/tickers in Supabase
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/complete_database.py ${{ inputs.dry_run && '--dry-run' || '' }}
