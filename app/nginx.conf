# Serves the built SPA. react-router uses browser history routing (see
# src/main.jsx), so any path that isn't a real static file has to fall back
# to index.html or a refresh on e.g. /etf/SPY 404s instead of loading the app.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
